<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Schüler-Memory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game">
    <div id="board" class="board"></div>

    <div class="sidebar">
      <div id="nameButtons" class="name-buttons"></div>
      <div id="status" class="status"></div>
    </div>
	
	<div id="overlay" class="overlay hidden">

		<h2 id="overlayTitle">Spiel beendet!</h2>
		<p id="overlayText">Alle Schüler wurden erkannt 🎉</p>
		<button id="restartBtn">Nochmal spielen</button>
	  </div>
	</div>
	
  </div>

<!--<input type="button" value="click to toggle fullscreen" onclick="toggleFullScreen()">-->
	<img src="symbols/fullscreen.png" class="fullscreen-btn" onclick="toggleFullScreen()" alt="Fullscreen">

  <script src="script.js"></script>

</html>
